<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="container">
            <h1>Rock Papper Scissor</h1>
            <div class="icon">
                <img src="Rock.png" alt="" id="rock">
                <img src="scissor.webp" alt="" id="scissor">
                <img src="papper.jpeg" alt="" id="papper">
            </div>
            <div class="result">
                <p id="result"></p>
            </div>
            <div class="score">
                <div class="humanScore">
                    <h2>Your Score.</h2>
                    <h1 id="humanScore"></h1>
                </div>
                <div class="computerScore">
                    <h2>Computer Score.</h2>
                    <h1 id="computerScore"></h1>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
